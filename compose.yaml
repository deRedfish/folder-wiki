services:
  wiki:
    build: .
    user: "${FOLDER_WIKI_UID:-1000}:${FOLDER_WIKI_GID:-1000}"
    ports:
      - "${FOLDER_WIKI_PORT:-4173}:4173"
    volumes:
      - "${FOLDER_WIKI_CONTENT:-./content}:/app/content"
    environment:
      RUNTIME_ROOT: /app/content/.folder-wiki
    restart: unless-stopped
